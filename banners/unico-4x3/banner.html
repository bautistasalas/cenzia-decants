<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner "Único en el país" + 4x3 en toda la web</title>
<!-- Banner del carrusel de la portada. Dos formatos con el mismo contenido:
       banner.html              -> computadora, 1920 x 736 (la medida de los que están en la tienda)
       banner.html?f=celular    -> celular, 1920 x 1440 (4:3, como los del carrusel de celular)
     Se generan con:  cd banners && node render.js unico-4x3/banner.html
     Sigue al banner "Único en el país" que ya estaba en la tienda, con la tipografía y el color de la
     marca (Poppins + Manrope, #0d161f) y el aviso del 4x3. El frasco es el mismo de ese banner
     (assets/decant-negro-inclinado.png). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d161f;--gris:#4f5a66;--linea:#d9dee3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:"Poppins",system-ui,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
.banner{position:relative;overflow:hidden;background:#fff;width:1920px;height:736px}
.txt{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.promo{display:flex;align-items:center}
.pill{display:inline-flex;align-items:center;background:var(--navy);color:#fff;border-radius:999px;white-space:nowrap}
.pill b{font-weight:800;line-height:1;letter-spacing:-.01em}
.pill i{display:block;background:rgba(255,255,255,.4)}
.pill span{font-weight:600;line-height:1;letter-spacing:.15em;margin-right:-.15em}
.sub{font-family:"Manrope",system-ui,sans-serif;font-weight:700;color:var(--gris);white-space:nowrap}
.h1{font-weight:800;line-height:1.02;letter-spacing:-.022em;word-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.feats{display:grid}
.f{position:relative;text-align:center}
.f svg{display:block;margin:0 auto;fill:none;stroke:var(--navy);stroke-linecap:round;stroke-linejoin:round}
.f svg .p{fill:var(--navy);stroke:none}
.f span{display:block;font-weight:500}
.bot{position:absolute;display:block;mix-blend-mode:multiply}

/* ---------- computadora: 1920 x 736 ---------- */
.txt{left:150px;width:1150px}
.promo{gap:26px;margin-bottom:28px}
.pill{height:88px;padding:0 40px 0 34px}
.pill b{font-size:56px}
.pill i{width:2px;height:38px;margin:0 22px}
.pill span{font-size:25px}
.sub{font-size:26px}
.h1{font-size:132px;margin-bottom:42px}
.feats{grid-template-columns:repeat(4,1fr);width:1104px}
.f{padding:4px 8px}
.f + .f::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:1.5px;background:var(--linea)}
.f + .f::after{content:"";position:absolute;left:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--navy)}
.f svg{width:72px;height:72px;stroke-width:2.2;margin-bottom:14px}
.f span{font-size:25px;line-height:1.36}
.bot{left:1372px;top:10px;height:726px}

/* ---------- celular: 1920 x 1440 ---------- */
.celular .banner{height:1440px}
.celular .txt{left:140px;width:1040px}
.celular .promo{display:block;margin-bottom:44px}
.celular .pill{height:156px;padding:0 58px 0 50px}
.celular .pill b{font-size:104px}
.celular .pill i{width:3px;height:68px;margin:0 34px}
.celular .pill span{font-size:46px;letter-spacing:.13em;margin-right:-.13em}
.celular .sub{font-size:44px;line-height:1.3;margin:18px 0 0 52px}
.celular .h1{font-size:188px;line-height:1.04;margin-bottom:50px}
.celular .feats{grid-template-columns:repeat(2,1fr);width:980px;position:relative}
.celular .f{padding:26px 10px 22px}
.celular .f + .f::before,.celular .f + .f::after{content:none}
.celular .f:nth-child(odd)::before{content:"";position:absolute;right:-1px;left:auto;top:16px;bottom:16px;width:2px;background:var(--linea)}
.celular .f:nth-child(-n+2)::after{content:"";position:absolute;left:16px;right:16px;top:auto;bottom:-1px;width:auto;height:2px;margin:0;border-radius:0;background:var(--linea)}
.celular .feats::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--navy)}
.celular .f svg{width:94px;height:94px;stroke-width:2.1;margin-bottom:18px}
.celular .f span{font-size:48px;line-height:1.28}
.celular .bot{left:1128px;top:58px;height:1336px}
</style>
</head>
<body>
<div class="banner">
  <div class="txt">
    <div class="promo">
      <div class="pill"><b>4x3</b><i></i><span>EN TODA LA WEB</span></div>
      <div class="sub">Llevás 4, pagás 3</div>
    </div>
    <div class="h1"><span class="l1">Único en</span> <span class="l2">el país</span></div>
    <div class="feats">
      <div class="f">
        <svg viewBox="0 0 48 48"><path d="M24 4.5 39 10v12.5C39 32.6 32.6 39.9 24 43.5 15.4 39.9 9 32.6 9 22.5V10z"/><path d="m17 23.6 5 5L31.5 18.5"/></svg>
        <span>Resistente<br>a caídas</span>
      </div>
      <div class="f">
        <svg viewBox="0 0 48 48"><rect x="6.5" y="22" width="17" height="21.5" rx="3"/><path d="M10.5 22v-5h9v5"/><rect x="9" y="9" width="12" height="8" rx="2"/><path d="M21 13h3.5"/><circle class="p" cx="29.5" cy="13" r="1.75"/><circle class="p" cx="34.5" cy="9" r="1.75"/><circle class="p" cx="34.5" cy="17" r="1.75"/><circle class="p" cx="39.5" cy="5" r="1.75"/><circle class="p" cx="39.5" cy="13" r="1.75"/><circle class="p" cx="39.5" cy="21" r="1.75"/></svg>
        <span>120<br>atomizaciones</span>
      </div>
      <div class="f">
        <svg viewBox="0 0 48 48"><path d="M13.5 41c-5-4.5-5-8.5 0-13s5-8.5 0-13"/><path d="M24 36c-5-4.5-5-8.5 0-13s5-8.5 0-13"/><path d="M34.5 41c-5-4.5-5-8.5 0-13s5-8.5 0-13"/></svg>
        <span>No pierde<br>aroma</span>
      </div>
      <div class="f">
        <svg viewBox="0 0 48 48"><rect x="6" y="15" width="36" height="27" rx="4.5"/><path d="M17.5 15v-4.5A2.5 2.5 0 0 1 20 8h8a2.5 2.5 0 0 1 2.5 2.5V15"/><path d="M15 21.5v14M33 21.5v14M21.5 28.5h5"/></svg>
        <span>Ideal para<br>viajar</span>
      </div>
    </div>
  </div>
  <img class="bot" src="../assets/decant-negro-inclinado.png" alt="">
</div>
<script>
// ?f=celular arma la versión de celular (en la de computadora el título va en un solo renglón)
if (new URLSearchParams(location.search).get('f') === 'celular') {
  document.documentElement.classList.add('celular');
  document.querySelector('.h1 .l1').insertAdjacentHTML('afterend', '<br>');
}
</script>
</body>
</html>
