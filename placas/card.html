<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Placa de galería por perfume, 2000 x 2000 px.
     Izquierda: foto del perfume rodeado de sus materias primas (sin el frasco Cenzia Privé).
     Derecha: recorrido olfativo detallado. Los datos llegan como JSON en el hash de la URL. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d161f;--soft:#5b6672;--line:#dfe3e8;--tint:#f4f6f8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2000px;height:2000px;background:#fff}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.card{position:relative;width:2000px;height:2000px;background:#fff;overflow:hidden}

/* Encabezado: mismo esquema que las fotos de combos (eyebrow · título · pill) */
.head{position:absolute;left:0;right:0;top:104px;text-align:center}
.eyebrow{font-family:"Poppins",sans-serif;font-weight:400;font-size:60px;letter-spacing:.42em;margin-right:-.42em;line-height:1}
.title{font-family:"Poppins",sans-serif;font-weight:800;line-height:1.02;letter-spacing:-.01em;margin:30px auto 0;max-width:1800px;text-transform:uppercase}
.sub{margin-top:34px;display:flex;justify-content:center;align-items:center;gap:34px}
.brand{font-size:72px;font-weight:600;color:var(--soft)}
.pill{display:inline-block;background:var(--ink);color:#fff;font-family:"Poppins",sans-serif;font-weight:600;font-size:52px;line-height:1;padding:23px 48px 25px;border-radius:999px}

/* Foto: el perfume rodeado de sus materias primas */
.scene{position:absolute;left:80px;top:600px;width:900px;height:1180px;border-radius:48px;overflow:hidden;background:var(--tint)}
.scene img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:80px;width:900px;top:1818px;text-align:center;font-family:"Poppins",sans-serif;font-weight:500;font-size:46px;line-height:1.2;color:var(--soft)}
.cap b{color:var(--ink);font-weight:700}

/* Recorrido olfativo */
.info{position:absolute;left:1060px;right:90px;top:606px}
.label{font-family:"Poppins",sans-serif;font-weight:400;font-size:48px;letter-spacing:.30em;line-height:1}
.rule{height:5px;background:var(--line);margin:28px 0 6px}
.row{padding:30px 0 32px;border-bottom:3px solid var(--line)}
.tier{display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:42px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;line-height:1}
.notes{display:block;margin-top:14px;font-family:"Poppins",sans-serif;font-weight:700;font-size:var(--notes,66px);line-height:1.12}
.txt{display:block;margin-top:12px;font-size:var(--txt,46px);font-weight:500;line-height:1.3;color:var(--soft)}
.meta{margin-top:34px;display:grid;grid-template-columns:auto 1fr;gap:16px 34px;align-items:baseline}
.meta span{font-family:"Poppins",sans-serif;font-weight:600;font-size:38px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);line-height:1.2}
.meta b{font-family:"Poppins",sans-serif;font-weight:600;font-size:var(--txt,46px);line-height:1.2}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <div class="eyebrow">INSPIRADA EN</div>
    <h1 class="title" id="title"></h1>
    <div class="sub"><span class="brand" id="brand"></span><span class="pill">Cenzia Privé</span></div>
  </div>
  <div class="scene"><img id="scene" alt=""></div>
  <div class="cap"><b>Esencia Privé</b> de 60 ml · Eau de Parfum</div>
  <div class="info" id="info">
    <div class="label">RECORRIDO OLFATIVO</div>
    <div class="rule"></div>
    <div id="rows"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const title = document.getElementById('title');
title.textContent = d.name;
document.getElementById('brand').textContent = d.brand ? 'de ' + d.brand : '';
const scene = document.getElementById('scene');
scene.src = d.scene;
if (d.scene_pos) scene.style.objectPosition = d.scene_pos;
document.getElementById('rows').innerHTML = [['Salida', d.salida, d.salida_txt], ['Corazón', d.corazon, d.corazon_txt], ['Fondo', d.fondo, d.fondo_txt]]
  .map(([t, n, x]) => `<div class="row"><span class="tier">${t}</span><span class="notes">${n}</span>${x ? `<span class="txt">${x}</span>` : ''}</div>`).join('');
document.getElementById('meta').innerHTML = [['Familia', d.familia], ['Ideal para', d.ideal], ['Intensidad', d.intensidad]]
  .filter(([, v]) => v).map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('');

document.fonts.ready.then(() => {
  // Título: una sola línea, lo más grande que entre
  let size = 168;
  title.style.fontSize = size + 'px';
  title.style.whiteSpace = 'nowrap';
  while (title.scrollWidth > 1800 && size > 92) { size -= 2; title.style.fontSize = size + 'px'; }
  // Columna de texto: si no entra hasta el borde inferior, se achica de a poco
  const info = document.getElementById('info');
  let notes = 66, txt = 46;
  const fits = () => info.getBoundingClientRect().bottom <= 1900;
  while (!fits() && notes > 48) {
    notes -= 2; txt = Math.max(38, txt - 1);
    info.style.setProperty('--notes', notes + 'px');
    info.style.setProperty('--txt', txt + 'px');
  }
  document.body.setAttribute('data-ready', '1');
  document.body.setAttribute('data-fit', fits() ? 'ok' : 'overflow');
});
</script>
</body>
</html>
