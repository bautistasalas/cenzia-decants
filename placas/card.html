<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Placa de galería por perfume, 2000 x 2000 px. Los datos llegan como JSON en el hash de la URL.
     Izquierda: el perfume solo, rodeado de sus materias primas (sin el frasco Cenzia Privé).
     Derecha: recomendación de uso + recorrido olfativo detallado.
     Dos modos:
       - boceto: frasco real recortado + zonas rotuladas para cada materia (guía para generar la foto en Runway).
       - final:  la foto ya generada (campo "scene"). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d161f;--soft:#5b6672;--line:#dfe3e8;--tint:#f4f6f8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2000px;height:2000px;background:#fff}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.card{position:relative;width:2000px;height:2000px;background:#fff;overflow:hidden}

/* Encabezado: mismo esquema que las fotos de combos (eyebrow · título · pill) */
.head{position:absolute;left:0;right:0;top:92px;text-align:center}
.eyebrow{font-family:"Poppins",sans-serif;font-weight:400;font-size:56px;letter-spacing:.42em;margin-right:-.42em;line-height:1}
.title{font-family:"Poppins",sans-serif;font-weight:800;line-height:1.02;letter-spacing:-.01em;margin:28px auto 0;max-width:1800px;text-transform:uppercase}
.sub{margin-top:30px;display:flex;justify-content:center;align-items:center;gap:32px}
.brand{font-size:68px;font-weight:600;color:var(--soft)}
.pill{display:inline-block;background:var(--ink);color:#fff;font-family:"Poppins",sans-serif;font-weight:600;font-size:50px;line-height:1;padding:22px 46px 24px;border-radius:999px}

/* Foto: el perfume rodeado de sus materias primas */
.scene{position:absolute;left:80px;top:556px;width:830px;height:1226px;border-radius:48px;overflow:hidden;background:linear-gradient(180deg,#eef1f4 0%,#f7f8fa 62%,#eceff3 100%)}
.scene>img.full{width:100%;height:100%;object-fit:cover;display:block}
.scene .bottle{position:absolute;left:50%;bottom:150px;height:700px;transform:translateX(-50%);mix-blend-mode:multiply;z-index:2}
.zone{position:absolute;border:6px dashed #8793a1;background:rgba(13,22,31,.045);border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;z-index:1}
.zone b{font-family:"Poppins",sans-serif;font-weight:700;font-size:30px;line-height:1.1;color:#3d4753;text-transform:uppercase;letter-spacing:.03em}
.zone i{font-style:normal;font-family:"Poppins",sans-serif;font-weight:500;font-size:27px;line-height:1.2;color:#5b6672;margin-top:6px}
.zone.front{z-index:3;background:rgba(255,255,255,.72)}
.cap{position:absolute;left:80px;width:830px;top:1822px;text-align:center;font-family:"Poppins",sans-serif;font-weight:500;font-size:40px;line-height:1.2;color:var(--soft);white-space:nowrap}
.cap b{color:var(--ink);font-weight:700}

/* Columna de texto */
.info{position:absolute;left:980px;right:84px;top:556px}
.reco{background:var(--tint);border-radius:40px;padding:38px 46px 42px}
.reco span{display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:36px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;line-height:1}
.reco p{margin-top:18px;font-family:"Poppins",sans-serif;font-weight:600;font-size:var(--reco,50px);line-height:1.26}
.label{margin-top:50px;font-family:"Poppins",sans-serif;font-weight:400;font-size:46px;letter-spacing:.30em;line-height:1}
.rule{height:5px;background:var(--line);margin:26px 0 4px}
.row{padding:26px 0 28px;border-bottom:3px solid var(--line)}
.tier{display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:40px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;line-height:1}
.notes{display:block;margin-top:12px;font-family:"Poppins",sans-serif;font-weight:700;font-size:var(--notes,62px);line-height:1.12}
.txt{display:block;margin-top:10px;font-size:var(--txt,44px);font-weight:500;line-height:1.28;color:var(--soft)}
.meta{margin-top:30px;display:grid;grid-template-columns:auto 1fr;gap:14px 32px;align-items:baseline}
.meta span{font-family:"Poppins",sans-serif;font-weight:600;font-size:36px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);line-height:1.2}
.meta b{font-family:"Poppins",sans-serif;font-weight:600;font-size:var(--txt,44px);line-height:1.2}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <div class="eyebrow">INSPIRADA EN</div>
    <h1 class="title" id="title"></h1>
    <div class="sub"><span class="brand" id="brand"></span><span class="pill">Cenzia Privé</span></div>
  </div>
  <div class="scene" id="scene"></div>
  <div class="cap"><b>Esencia Privé</b> · 60 ml · Eau de Parfum</div>
  <div class="info" id="info">
    <div class="reco"><span>Te la recomendamos para</span><p id="reco"></p></div>
    <div class="label">RECORRIDO OLFATIVO</div>
    <div class="rule"></div>
    <div id="rows"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const mode = d.mode || (d.scene ? 'final' : 'boceto');
const title = document.getElementById('title');
title.textContent = d.name;
document.getElementById('brand').textContent = d.brand ? 'de ' + d.brand : '';
document.getElementById('reco').textContent = d.reco || '';
document.getElementById('rows').innerHTML = [['Salida', d.salida, d.salida_txt], ['Corazón', d.corazon, d.corazon_txt], ['Fondo', d.fondo, d.fondo_txt]]
  .map(([t, n, x]) => `<div class="row"><span class="tier">${t}</span><span class="notes">${n}</span>${x ? `<span class="txt">${x}</span>` : ''}</div>`).join('');
document.getElementById('meta').innerHTML = [['Familia', d.familia], ['Intensidad', d.intensidad]]
  .filter(([, v]) => v).map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('');

// Foto
const scene = document.getElementById('scene');
if (mode === 'final') {
  scene.innerHTML = `<img class="full" src="${d.scene}" style="object-position:${d.scene_pos || '50% 50%'}">`;
} else {
  // Boceto: frasco real + una zona rotulada por materia, repartidas alrededor del frasco
  const ZONES = [
    { cls: '',      css: 'left:26px;top:240px;width:190px;height:560px' },     // atrás a la izquierda (alto: ramas, espigas)
    { cls: '',      css: 'right:26px;top:280px;width:190px;height:520px' },    // atrás a la derecha (alto)
    { cls: 'front', css: 'left:36px;bottom:56px;width:290px;height:170px' },   // adelante a la izquierda (bajo)
    { cls: 'front', css: 'right:36px;bottom:56px;width:290px;height:170px' },  // adelante a la derecha (bajo)
    { cls: 'front', css: 'left:50%;margin-left:-110px;bottom:26px;width:220px;height:110px' }, // adelante al centro
  ];
  const zones = (d.materias || []).slice(0, ZONES.length).map((m, i) => {
    const z = ZONES[m.zona != null ? m.zona : i];
    return `<div class="zone ${z.cls}" style="${z.css}"><b>${m.nombre}</b>${m.detalle ? `<i>${m.detalle}</i>` : ''}</div>`;
  }).join('');
  scene.innerHTML = zones + `<img class="bottle" src="${d.bottle}" alt="">`;
}

document.fonts.ready.then(() => {
  // Título: una sola línea, lo más grande que entre
  let size = 160;
  title.style.fontSize = size + 'px';
  title.style.whiteSpace = 'nowrap';
  while (title.scrollWidth > 1800 && size > 92) { size -= 2; title.style.fontSize = size + 'px'; }
  // Columna de texto: si no entra hasta el borde inferior, se achica de a poco
  const info = document.getElementById('info');
  let notes = 62, txt = 44, reco = 50;
  const fits = () => info.getBoundingClientRect().bottom <= 1904;
  while (!fits() && notes > 46) {
    notes -= 2; txt = Math.max(37, txt - 1); reco = Math.max(42, reco - 1);
    info.style.setProperty('--notes', notes + 'px');
    info.style.setProperty('--txt', txt + 'px');
    info.style.setProperty('--reco', reco + 'px');
  }
  document.body.setAttribute('data-ready', '1');
  document.body.setAttribute('data-fit', fits() ? 'ok' : 'overflow');
});
</script>
</body>
</html>
