<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Placa de galería por perfume, 2000 x 2000 px. Los datos llegan como JSON en el hash de la URL.
     Izquierda: el perfume solo, rodeado de sus materias primas (sin el frasco Cenzia Privé).
     Debajo de la foto: recomendación de uso. Derecha: recorrido olfativo detallado.
     Dos modos:
       - boceto: frasco real recortado + zonas rotuladas para cada materia (guía para generar la foto en Runway).
       - final:  la foto ya generada (campo "scene"). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d161f;--soft:#5b6672;--line:#dfe3e8;--tint:#f4f6f8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2000px;height:2000px;background:#fff}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.card{position:relative;width:2000px;height:2000px;background:#fff;overflow:hidden}

/* Encabezado chico a propósito: lo que tiene que destacar es la información de abajo */
.head{position:absolute;left:0;right:0;top:84px;text-align:center}
.eyebrow{font-family:"Poppins",sans-serif;font-weight:400;font-size:42px;letter-spacing:.42em;margin-right:-.42em;line-height:1;color:var(--soft)}
.title{font-family:"Poppins",sans-serif;font-weight:700;line-height:1.05;letter-spacing:0;margin:22px auto 0;max-width:1700px;text-transform:uppercase}
.sub{margin-top:22px;display:flex;justify-content:center;align-items:center;gap:26px}
.brand{font-size:50px;font-weight:600;color:var(--soft)}
.pill{display:inline-block;background:var(--ink);color:#fff;font-family:"Poppins",sans-serif;font-weight:600;font-size:38px;line-height:1;padding:17px 36px 19px;border-radius:999px}

/* Foto 3:4: el perfume rodeado de sus materias primas */
.scene{position:absolute;left:80px;top:404px;width:900px;height:1200px;border-radius:48px;overflow:hidden;background:linear-gradient(180deg,#eef1f4 0%,#f7f8fa 62%,#eceff3 100%)}
.scene>img.full{width:100%;height:100%;object-fit:cover;display:block}
.scene .bottle{position:absolute;left:50%;bottom:170px;height:700px;transform:translateX(-50%);mix-blend-mode:multiply;z-index:2}
.zone{position:absolute;border:6px dashed #8793a1;background:rgba(13,22,31,.045);border-radius:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;z-index:1}
.zone b{font-family:"Poppins",sans-serif;font-weight:700;font-size:30px;line-height:1.1;color:#3d4753;text-transform:uppercase;letter-spacing:.03em}
.zone i{font-style:normal;font-family:"Poppins",sans-serif;font-weight:500;font-size:27px;line-height:1.2;color:#5b6672;margin-top:6px}
.zone.front{z-index:3;background:rgba(255,255,255,.72)}

/* Recomendación de uso, debajo de la foto */
.reco{position:absolute;left:80px;width:900px;top:1636px;height:268px;background:var(--tint);border-radius:40px;padding:0 46px;display:flex;flex-direction:column;justify-content:center}
.reco span{display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:34px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;line-height:1}
.reco p{margin-top:16px;font-family:"Poppins",sans-serif;font-weight:600;font-size:50px;line-height:1.22}

/* Recorrido olfativo */
.info{position:absolute;left:1050px;right:84px;top:404px}
.label{font-family:"Poppins",sans-serif;font-weight:400;font-size:46px;letter-spacing:.28em;line-height:1;margin-top:8px}
.rule{height:5px;background:var(--line);margin:28px 0 4px}
.row{padding:34px 0 36px;border-bottom:3px solid var(--line)}
.tier{display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:42px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;line-height:1}
.notes{display:block;margin-top:14px;font-family:"Poppins",sans-serif;font-weight:700;font-size:var(--notes,72px);line-height:1.12}
.txt{display:block;margin-top:12px;font-size:var(--txt,50px);font-weight:500;line-height:1.28;color:var(--soft)}
.meta{margin-top:36px;display:grid;grid-template-columns:auto 1fr;gap:16px 30px;align-items:baseline}
.meta span{font-family:"Poppins",sans-serif;font-weight:600;font-size:36px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);line-height:1.2}
.meta b{font-family:"Poppins",sans-serif;font-weight:600;font-size:var(--txt,50px);line-height:1.2}
.cap{position:absolute;left:1050px;right:84px;bottom:96px;font-family:"Poppins",sans-serif;font-weight:500;font-size:40px;line-height:1.2;color:var(--soft);white-space:nowrap;border-top:3px solid var(--line);padding-top:30px}
.cap b{color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <div class="eyebrow">INSPIRADA EN</div>
    <h1 class="title" id="title"></h1>
    <div class="sub"><span class="brand" id="brand"></span><span class="pill">Cenzia Privé</span></div>
  </div>
  <div class="scene" id="scene"></div>
  <div class="reco"><span>Te la recomendamos para</span><p id="reco"></p></div>
  <div class="info" id="info">
    <div class="label">RECORRIDO OLFATIVO</div>
    <div class="rule"></div>
    <div id="rows"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="cap"><b>Esencia Privé</b> · 60 ml · Eau de Parfum</div>
</div>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const mode = d.mode || (d.scene ? 'final' : 'boceto');
const title = document.getElementById('title');
title.textContent = d.name;
document.getElementById('brand').textContent = d.brand ? 'de ' + d.brand : '';
document.getElementById('reco').textContent = d.reco || '';
// Cada nota va entera en un renglón: el corte de línea solo cae entre una nota y la siguiente
const keep = s => String(s || '').split(' · ').map(n => n.trim().replace(/ /g, ' ')).join(' · ');
document.getElementById('rows').innerHTML = [['Salida', d.salida, d.salida_txt], ['Corazón', d.corazon, d.corazon_txt], ['Fondo', d.fondo, d.fondo_txt]]
  .map(([t, n, x]) => `<div class="row"><span class="tier">${t}</span><span class="notes">${keep(n)}</span>${x ? `<span class="txt">${x}</span>` : ''}</div>`).join('');
document.getElementById('meta').innerHTML = [['Familia', d.familia], ['Intensidad', d.intensidad]]
  .filter(([, v]) => v).map(([k, v]) => `<span>${k}</span><b>${keep(v)}</b>`).join('');

// Foto
const scene = document.getElementById('scene');
if (mode === 'final') {
  scene.innerHTML = `<img class="full" src="${d.scene}" style="object-position:${d.scene_pos || '50% 50%'}">`;
} else {
  // Boceto: frasco real + una zona rotulada por materia, repartidas alrededor del frasco
  const ZONES = [
    { cls: '',      css: 'left:30px;top:240px;width:210px;height:600px' },     // atrás a la izquierda (alto: ramas, espigas)
    { cls: '',      css: 'right:30px;top:290px;width:210px;height:550px' },    // atrás a la derecha (alto)
    { cls: 'front', css: 'left:40px;bottom:60px;width:310px;height:180px' },   // adelante a la izquierda (bajo)
    { cls: 'front', css: 'right:40px;bottom:60px;width:310px;height:180px' },  // adelante a la derecha (bajo)
    { cls: 'front', css: 'left:50%;margin-left:-115px;bottom:30px;width:230px;height:116px' }, // adelante al centro
  ];
  const zones = (d.materias || []).slice(0, ZONES.length).map((m, i) => {
    const z = ZONES[m.zona != null ? m.zona : i];
    return `<div class="zone ${z.cls}" style="${z.css}"><b>${m.nombre}</b>${m.detalle ? `<i>${m.detalle}</i>` : ''}</div>`;
  }).join('');
  scene.innerHTML = zones + `<img class="bottle" src="${d.bottle}" alt="">`;
}

document.fonts.ready.then(() => {
  // Título: una sola línea y contenido; no compite con la información
  let size = 92;
  title.style.fontSize = size + 'px';
  title.style.whiteSpace = 'nowrap';
  while (title.scrollWidth > 1700 && size > 60) { size -= 2; title.style.fontSize = size + 'px'; }
  // Columna de texto: tiene que terminar antes de la línea de "Esencia Privé · 60 ml"; si no entra, se achica de a poco
  const info = document.getElementById('info');
  const limit = document.querySelector('.cap').getBoundingClientRect().top - 36;
  let notes = 72, txt = 50;
  const fits = () => info.getBoundingClientRect().bottom <= limit;
  while (!fits() && notes > 46) {
    notes -= 2; txt = Math.max(37, txt - 1);
    info.style.setProperty('--notes', notes + 'px');
    info.style.setProperty('--txt', txt + 'px');
  }
  // Recomendación: como mucho tres líneas dentro de su caja
  const recoP = document.getElementById('reco');
  let rs = 50;
  while (recoP.getBoundingClientRect().height > 3 * rs * 1.22 + 2 && rs > 38) { rs -= 2; recoP.style.fontSize = rs + 'px'; }
  document.body.setAttribute('data-ready', '1');
  document.body.setAttribute('data-fit', fits() ? 'ok' : 'overflow');
});
</script>
</body>
</html>
