<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d161f;--soft:#5b6672;--line:#dfe3e8;--tint:#f4f6f8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2000px;height:2000px;background:#fff}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.card{position:relative;width:2000px;height:2000px;background:#fff;overflow:hidden}

/* Encabezado: mismo esquema que las fotos de combos (eyebrow · título · pill) */
.head{position:absolute;left:0;right:0;top:118px;text-align:center}
.eyebrow{font-family:"Poppins",sans-serif;font-weight:400;font-size:62px;letter-spacing:.42em;margin-right:-.42em;line-height:1}
.title{font-family:"Poppins",sans-serif;font-weight:800;line-height:1.02;letter-spacing:-.01em;margin:34px auto 0;max-width:1800px;text-transform:uppercase}
.sub{margin-top:40px;display:flex;justify-content:center;align-items:center;gap:34px}
.brand{font-size:74px;font-weight:600;color:var(--soft)}
.pill{display:inline-block;background:var(--ink);color:#fff;font-family:"Poppins",sans-serif;font-weight:600;font-size:54px;line-height:1;padding:24px 50px 26px;border-radius:999px}

/* Cuerpo */
.photo{position:absolute;left:70px;top:640px;width:940px;height:1080px}
.photo img{position:absolute;bottom:0;display:block;mix-blend-mode:multiply}
.photo .b-brand{left:0;height:1000px}
.photo .b-cenzia{right:0;height:640px}
.chips{position:absolute;left:70px;width:940px;top:1790px;display:flex;justify-content:center;gap:26px}
.chip{font-family:"Poppins",sans-serif;font-weight:600;font-size:50px;line-height:1;color:var(--ink);background:var(--tint);border-radius:999px;padding:24px 44px 26px}
.info{position:absolute;left:1090px;right:100px;top:690px}
.label{font-family:"Poppins",sans-serif;font-weight:400;font-size:50px;letter-spacing:.30em;line-height:1}
.rule{height:5px;background:var(--line);margin:30px 0 10px}
.row{padding:32px 0 34px;border-bottom:3px solid var(--line)}
.tier{display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:46px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;line-height:1}
.notes{display:block;margin-top:16px;font-family:"Poppins",sans-serif;font-weight:700;font-size:74px;line-height:1.12}

/* Materias primas con foto */
.keys{margin-top:56px;display:flex;justify-content:flex-start;gap:70px}
.key{text-align:center}
.key .ph{width:270px;height:270px;border-radius:50%;overflow:hidden;margin:0 auto;box-shadow:0 0 0 6px #fff,0 0 0 9px var(--line)}
.key .ph img{width:100%;height:100%;object-fit:cover;display:block}
.key b{display:block;margin-top:24px;font-family:"Poppins",sans-serif;font-weight:700;font-size:56px;line-height:1}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <div class="eyebrow">INSPIRADA EN</div>
    <h1 class="title" id="title"></h1>
    <div class="sub"><span class="brand" id="brand"></span><span class="pill">Cenzia Privé</span></div>
  </div>
  <div class="photo"><img class="b-brand" id="brandimg" alt=""><img class="b-cenzia" src="src/cenzia-prive.webp" alt=""></div>
  <div class="chips"><span class="chip">60 ml</span><span class="chip">Eau de Parfum</span></div>
  <div class="info">
    <div class="label">RECORRIDO OLFATIVO</div>
    <div class="rule"></div>
    <div id="rows"></div>
    <div class="keys" id="keys"></div>
  </div>
</div>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const title = document.getElementById('title');
title.textContent = d.name;
document.getElementById('brand').textContent = d.brand ? 'de ' + d.brand : '';
document.getElementById('brandimg').src = d.photo;
document.getElementById('rows').innerHTML = [['Salida', d.salida], ['Corazón', d.corazon], ['Fondo', d.fondo]]
  .map(([t, n]) => `<div class="row"><span class="tier">${t}</span><span class="notes">${n}</span></div>`).join('');
document.getElementById('keys').innerHTML = d.keys.map(k => `<div class="key"><div class="ph"><img src="${k.img}" style="object-position:${k.pos || '50% 50%'}"></div><b>${k.name}</b></div>`).join('');
// Ajuste del título al ancho disponible (una sola línea si entra, si no dos)
document.fonts.ready.then(() => {
  let size = 170;
  title.style.fontSize = size + 'px';
  title.style.whiteSpace = 'nowrap';
  while (title.scrollWidth > 1800 && size > 96) { size -= 2; title.style.fontSize = size + 'px'; }
  document.body.setAttribute('data-ready', '1');
});
</script>
</body>
</html>
